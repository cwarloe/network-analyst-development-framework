  <text x="511" y="239" class="range">10.100.0.0/16</text>
  <path d="M511 258 H747" stroke="#456e69"/>
  <text x="511" y="285" class="detail">DNS resolvers</text>
  <text x="511" y="306" class="small">10.100.1.10 / .11</text>
  <text x="511" y="337" class="detail">CAD pool</text>
  <text x="511" y="358" class="small">10.100.14.0/24</text>
  <text x="511" y="387" class="detail">Accounting</text>
  <text x="511" y="408" class="small">10.100.40.0/24</text>
  <rect class="site" x="777" y="178" width="165" height="248" rx="12"/>
