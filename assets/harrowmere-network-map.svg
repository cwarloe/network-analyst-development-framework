<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Harrowmere Equipment Group: Book 2 network and location reference</title>
  <desc id="map-desc">Three site networks: Portland Warehouse 10.110.0.0/16; corporate headquarters in Chicago 10.100.0.0/16, containing the CAD and accounting pools and corporate DNS resolvers; Chicago Manufacturing 10.120.0.0/16. An engineering segment 10.42.18.0/24 has no confirmed physical site. The diagram shows logical groupings, not network connections, sensor coverage, or incident paths.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size: 28px; font-weight: 750; fill: #eaf9f5; }
      .sub { font-size: 15px; fill: #aed6d0; }
      .city { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #93d4c6; }
      .place { font-size: 22px; font-weight: 700; fill: #f5fcfa; }
      .range { font-size: 19px; font-weight: 600; fill: #8ce0d0; }
      .detail { font-size: 15px; fill: #cfdfdc; }
      .small { font-size: 14px; fill: #a9c8c1; }
      .network { fill: #153c3c; stroke: #4c8f84; stroke-width: 2; }
      .site { fill: #173038; stroke: #3c626a; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1000" height="580" rx="20" fill="#0c2228"/>
  <path d="M0 107 H1000" stroke="#2d5256" stroke-width="2"/>
  <text x="42" y="49" class="title">HARROWMERE  /  ENVIRONMENT MAP</text>
  <text x="42" y="80" class="sub">Book 2 reference • stable locations and network ranges • no case findings</text>

