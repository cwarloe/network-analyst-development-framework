  <path d="M81 252 H394" stroke="#355962"/>
  <text x="81" y="286" class="detail">Warehouse workstations</text>
  <text x="81" y="321" class="detail">Internal repository services</text>
  <text x="81" y="401" class="small">Site subnet • physical location known</text>

  <text x="465" y="144" class="city">CHICAGO, ILLINOIS</text>
  <rect x="465" y="160" width="493" height="285" rx="15" fill="#142d35" stroke="#365a65" stroke-width="2"/>
  <rect class="network" x="480" y="178" width="284" height="248" rx="12"/>
  <rect x="495" y="194" width="5" height="43" rx="2" fill="#74cdbb"/>
