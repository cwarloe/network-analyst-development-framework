<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Analyst Development Framework</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Training material and narrative companion track for network analysts working in cyber defense.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
  <link rel="stylesheet" href="assets/nadf-theme.css">

</head>
<body>
  <div id="app">Loading Network Analyst Development Framework...</div>

  <div id="lnk-tooltip" role="tooltip">
    <div class="tt-tier" id="tt-tier">Vocabulary</div>
    <div class="tt-title" id="tt-title"></div>
    <div class="tt-body" id="tt-body"></div>
    <div class="tt-context" id="tt-context"></div>
  </div>

  <script>
    // Load Master Glossary
    window.__GLOSSARY__ = {};
    fetch('assets/glossary.json')
      .then(res => res.json())
      .then(data => { window.__GLOSSARY__ = data; })
      .catch(err => console.warn('Could not load assets/glossary.json', err));

    window.$docsify = {
      name: 'Network Analyst Framework',
      repo: 'https://github.com/cwarloe/network-analyst-development-framework',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      relativePath: true,
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search lessons & narrative...',
        noData: 'No results found.',
        depth: 3
      },
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$']],
        overflowScroll: true
      },
      plugins: [
        function(hook) {
          // Docsify turns every local link into a page route, so links to captures, videos,
          // scripts and folders (which are files, not pages) find nothing. Point them at the
          // real file on this site, or at GitHub where the site does not serve one.
          var GH = 'https://github.com/cwarloe/network-analyst-development-framework/';
          var SITE = ['pcap', 'mp4', 'html', 'png', 'svg'];
          function open(a, url) { a.setAttribute('href', url); a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); }
          hook.doneEach(function() {
            document.querySelectorAll('.markdown-section a[href^="#/"]').forEach(function(a) {
              if (a.getAttribute('href').indexOf('?id=') >= 0) return;   // in-page heading link
              var p = a.getAttribute('href').slice(2).split('?')[0];
              try { p = decodeURIComponent(p); } catch (e) {}
              p = p.replace(/\/+$/, '');
              if (!p) return;
              var ext = (p.split('/').pop().match(/\.([A-Za-z0-9]+)$/) || [])[1];
              if (ext) {
                if (SITE.indexOf(ext.toLowerCase()) >= 0) open(a, p);
                else open(a, GH + 'blob/main/' + p);
                return;
              }
              // No extension: a page, a folder, or a file such as LICENSE. Ask the site.
              Promise.all([fetch(p + '.md', {method: 'HEAD'}), fetch(p + '/README.md', {method: 'HEAD'})])
                .then(function(r) {
                  if (r[0].ok) return;
                  if (r[1].ok) { a.setAttribute('href', '#/' + p + '/'); return; }
                  open(a, GH + (p === 'LICENSE' ? 'blob' : 'tree') + '/main/' + p);
                }).catch(function() {});
            });
          });
        },
        function(hook) {
          // Parse [[id|Surface Text]] into interactive LNK hover elements with auto IDs and tier classes
          hook.beforeEach(function(content) {
            return content.replace(/`?\[\[([a-zA-Z0-9_-]+)\|([^\]]+)\]\]`?/g, function(match, id, text) {
              const item = window.__GLOSSARY__[id];
              const cat = (item && item.category) ? item.category : 'telemetry';
              return `<span class="term ${cat}" id="term-${id}" data-term="${id}">${text}</span>`;
            });
          });

          // Bind LNK tooltip events and handle intuitive glossary click-to-jump
          hook.doneEach(function() {
            // Apply category classes to terms if loaded asynchronously
            document.querySelectorAll('.term').forEach(function(el) {
              const id = el.getAttribute('data-term');
              const item = window.__GLOSSARY__[id];
              if (item && item.category) el.classList.add(item.category);
            });

            const tooltip = document.getElementById('lnk-tooltip');
            const ttTier = document.getElementById('tt-tier');
            const ttTitle = document.getElementById('tt-title');
            const ttBody = document.getElementById('tt-body');
            const ttContext = document.getElementById('tt-context');

            function placeTooltip(e) {
              const pad = 14;
              let x = (e.pageX || (e.touches && e.touches[0] ? e.touches[0].pageX : 0)) + pad;
              let y = (e.pageY || (e.touches && e.touches[0] ? e.touches[0].pageY : 0)) + pad;
              tooltip.style.left = x + 'px';
              tooltip.style.top = y + 'px';
              const rect = tooltip.getBoundingClientRect();
              if (rect.right > window.innerWidth - 8) {
                x = (e.pageX || 0) - rect.width - pad;
                tooltip.style.left = Math.max(8, x) + 'px';
              }
              if (rect.bottom > window.innerHeight - 8) {
                y = (e.pageY || 0) - rect.height - pad;
                tooltip.style.top = Math.max(window.scrollY + 8, y) + 'px';
              }
            }

            function showTooltip(el, e) {
              const id = el.getAttribute('data-term');
              const item = window.__GLOSSARY__[id];
              if (!item) return;

              ttTier.textContent = (item.category || 'Vocabulary').toUpperCase();
              ttTitle.textContent = item.title || id;
              ttBody.textContent = item.definition || '';
              if (item.context) {
                ttContext.textContent = item.context;
                ttContext.style.display = 'block';
              } else {
                ttContext.style.display = 'none';
              }
              tooltip.style.display = 'block';
              placeTooltip(e);
            }

            // In-text hover & tap popovers
            let activeTouchTerm = null;
            document.querySelectorAll('.term').forEach(function(el) {
              el.addEventListener('mouseenter', function(e) {
                showTooltip(el, e);
              });

              el.addEventListener('mousemove', function(e) {
                if (tooltip.style.display === 'block') placeTooltip(e);
              });

              el.addEventListener('mouseleave', function() {
                tooltip.style.display = 'none';
              });

              // Mobile tap handling
              el.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                  if (activeTouchTerm === el && tooltip.style.display === 'block') {
                    tooltip.style.display = 'none';
                    activeTouchTerm = null;
                  } else {
                    activeTouchTerm = el;
                    showTooltip(el, e);
                  }
                }
              });
            });

            document.addEventListener('click', function(e) {
              if (!e.target.closest('.term') && !e.target.closest('#lnk-tooltip')) {
                tooltip.style.display = 'none';
                activeTouchTerm = null;
              }
            });

            // Intuitive Term Click: Clicking any term link in the glossary glides to story & flashes
            document.querySelectorAll('a[href*="#term-"], a[href*="#ref-"]').forEach(function(link) {
              link.addEventListener('click', function(e) {
                const href = link.getAttribute('href');
                const hashIndex = href.indexOf('#');
                if (hashIndex === -1) return;
                const targetId = href.substring(hashIndex + 1);
                const targetEl = document.getElementById(targetId) || document.querySelector(`.term[data-term="${targetId.replace('term-', '')}"]`);
                if (targetEl) {
                  e.preventDefault();
                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  targetEl.classList.remove('flash', 'story-highlight');
                  void targetEl.offsetWidth; // Trigger reflow
                  targetEl.classList.add('flash');
                  setTimeout(function() {
                    targetEl.classList.remove('flash');
                  }, 1400);
                }
              });
            });
          });
        }
      ]
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- KaTeX Core Library & Docsify LaTeX Plugin -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy to clipboard -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Code highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <!-- NADF Custom Shell (Modes & Glossary Drawer) -->
  <script src="assets/nadf-shell.js"></script>
</body>
</html>
